# PostgreSQL and the app. Put this file and a .env (copy of .env.example) in one folder on the
# server, fill in .env, run `docker compose up -d`.
name: <project>

# Hardening for every container: read-only, unprivileged, no extra rights.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:<PG_MAJOR>-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-<project>}
      POSTGRES_USER: ${DB_USER:-<project>}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      # The database. A newer Postgres major version needs a dump and restore, not just a new
      # image tag.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *hardened
    # `latest` follows every release; set APP_IMAGE in .env to pin a version.
    image: ${APP_IMAGE:-ghcr.io/<owner>/<project>:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "false"
      DB_HOST: db
      DB_PORT: "5432"
      # --- project: environment ---
      # --- end ---
    ports:
      - "${APP_BIND:-8080}:8080"
    volumes:
      - app-data:/data
      # [WORKER_PROGRAM+BACKUP_JOB]
      - backups:/backups
      # [/WORKER_PROGRAM+BACKUP_JOB]
    depends_on:
      db:
        condition: service_healthy
      # --- project: depends_on ---
      # --- end ---

  # [WORKER_SERVICE]
  # Background jobs: mails, the nightly backup, cleanup. Same image as the app.
  worker:
    <<: *hardened
    image: ${APP_IMAGE:-ghcr.io/<owner>/<project>:latest}
    restart: unless-stopped
    command: ["sh", "/usr/local/bin/worker"]
    # Lets `docker stop` end the worker cleanly.
    init: true
    env_file: .env
    environment:
      DEBUG: "false"
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - app-data:/data
      # [BACKUP_JOB]
      # Nightly backup (BACKUP_TIME and BACKUP_KEEP_DAYS in .env). Back up now:
      #   docker compose exec worker python manage.py backup_database
      # Copy backups off the server: docker compose cp worker:/backups ./backups
      - backups:/backups
      # [/BACKUP_JOB]
    healthcheck:
      # Checks that the worker reaches the database.
      test: ["CMD", "python", "manage.py", "procrastinate", "healthchecks"]
      interval: 60s
      timeout: 10s
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
  # [/WORKER_SERVICE]

  # [BACKUP_CONTAINER]
  # Nightly backup of the database and the uploaded files into the "backups" volume. Needs
  # docker/backup.sh next to this file. Back up now:  docker compose exec backup sh /backup.sh now
  # Copy backups off the server:  docker compose cp backup:/var/lib/postgresql/backups ./backups
  backup:
    <<: *hardened
    image: postgres:<PG_MAJOR>-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    user: postgres
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-<project>}
      PGUSER: ${DB_USER:-<project>}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: ${TIME_ZONE:-UTC}
      BACKUP_TIME: ${BACKUP_TIME:-01:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      # Has to stay at the postgres user's home, or the volume is not writable.
      - backups:/var/lib/postgresql
      # The uploaded files, read-only: they are only copied.
      - app-data:/appdata:ro
    depends_on:
      db:
        condition: service_healthy
  # [/BACKUP_CONTAINER]

  # Additional services of the project.
  # --- project: services ---
  # --- end ---

volumes:
  db-data:
  app-data:
  backups:
