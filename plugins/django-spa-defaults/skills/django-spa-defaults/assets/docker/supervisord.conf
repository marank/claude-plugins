; supervisord runs as PID 1 in the app container and keeps the web app (gunicorn, or uvicorn
; with ASGI) and nginx running. The job worker is its own compose service from the same image
; (docker/worker) or, as a variant, a program here. Everything runs as the
; unprivileged "app" user (see Dockerfile); runtime files live in /tmp.
; If a program keeps failing, exit-on-fatal stops supervisord and with it the container,
; so Docker's restart policy can take over.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; For `supervisorctl status` inside the container. supervisord logs a CRIT notice that it
; has no password; only "app" may open the socket (chmod 0700), which is enough here.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; [WSGI]
[program:gunicorn]
; Deploy checks, migrations and the first admin are done before supervisord starts
; (entrypoint.sh), so a restart of this program never migrates again. Workers, bind address,
; access log: gunicorn.conf.py.
command=gunicorn -c /etc/gunicorn.conf.py config.wsgi:application
directory=/app
priority=10
startsecs=5
startretries=3
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
; [/WSGI]

; [ASGI]
[program:uvicorn]
; The ASGI app (API, WebSockets) instead of gunicorn. Only nginx reaches it and sets
; X-Forwarded-* itself (django_proxy.conf), so uvicorn may trust them from 127.0.0.1.
; Workers: WEB_WORKERS, default 3. Deploy checks and migrations: entrypoint.sh.
command=/bin/sh -c 'exec uvicorn config.asgi:application --host 127.0.0.1 --port 8000 --workers "${WEB_WORKERS:-3}" --lifespan off --proxy-headers --forwarded-allow-ips 127.0.0.1'
directory=/app
priority=10
startsecs=5
startretries=3
autorestart=true
stopasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
; [/ASGI]

[program:nginx]
command=/bin/sh /usr/local/bin/start-nginx
priority=20
startsecs=2
startretries=3
autorestart=true
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; [WORKER_PROGRAM]
[program:worker]
; The job worker inside the app container (entrypoint.sh has migrated already) instead of its
; own compose service ([WORKER_SERVICE]): one container to run; fine for light jobs.
command=/bin/sh -c 'exec python manage.py procrastinate worker --concurrency "${WORKER_CONCURRENCY:-4}"'
directory=/app
priority=30
startsecs=5
startretries=3
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
; [/WORKER_PROGRAM]

; Further programs of the project (kept outside the template comparison, DOCKER-12).
; --- project: programs ---
; --- end ---

[eventlistener:exit-on-fatal]
command=python3 /usr/local/bin/exit-on-fatal
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
